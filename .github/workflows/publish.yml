name: publish

# v로 시작하는 태그를 밀면 발행한다. 태그와 package.json 버전이
# 어긋난 채 발행되는 것을 막기 위해 첫 단계에서 대조한다.
on:
  push:
    tags: ['v*']

jobs:
  # 발행 전에 선언한 Node 하한(engines: >=20)이 실제로 동작하는지 확인한다.
  # publish 잡은 22에서만 도니 여기서 20을 함께 돌려야 하한이 검증된다.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: agent-installer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 의존성 설치
        run: npm install

      - name: 테스트
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm --provenance가 OIDC 토큰을 요구한다
    defaults:
      run:
        working-directory: agent-installer
    steps:
      - uses: actions/checkout@v7

      # Trusted Publishing(토큰 없는 OIDC 발행)은 Node 22.14+ 와 npm 11.5.1+ 를
      # 요구한다. Node 22에 묶여 오는 npm은 10.x라 별도로 올려야 한다.
      #
      # 1.3.0 발행에서 NPM_TOKEN 경로가 EOTP(일회용 비밀번호 요구)로 막혔다.
      # 계정에 2FA가 걸려 있고 토큰이 그것을 우회하지 못하는 종류이기 때문이다.
      # 패키지는 이제 레지스트리에 있으므로(1.0.0·1.1.0) Trusted Publishing을
      # 구성할 수 있다 — npmjs.com의 패키지 설정에서 이 저장소와 publish.yml을
      # 등록한 뒤, 아래 발행 단계의 NODE_AUTH_TOKEN 줄을 지우면 된다.
      # 그때는 provenance도 OIDC로 자동이라 --provenance를 남겨 둬도 무해하다.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: npm 최신화
        run: npm install -g npm@latest

      - name: 태그와 package.json 버전 대조
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "태그 v$TAG 와 package.json $PKG 가 다릅니다" >&2
            exit 1
          fi

      - name: 의존성 설치
        run: npm install

      # 이름은 @rch4com/agent-setup 하나다. 정식 이름 agent-setup은 npm의
      # 유사 이름 제한(기존 agentsetup)에 걸려 403으로 거부된다.
      # access는 package.json의 publishConfig에 있다.
      - name: 발행
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
